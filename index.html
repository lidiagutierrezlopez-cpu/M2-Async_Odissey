<!DOCTYPE html>
<html lang="es">
     <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>M2 - Async Odyssey</title>
     </head>
     <body>
          <h1>El Museo en tu Bolsillo</h1>
          <form id="form">
               <input id="input" type="search" placeholder="Busca un artista o tema...">
               <button type="submit">Buscar</button>
          </form>
          <nav id="rooms" aria-label="Salas sugeridas"></nav>
          <button id="collection" type="button">Favoritos</button>
          <button id="open-collage" type="button">Collage</button>
          <div id="controls">
               <label>Ordenar
                    <select id="sort">
                         <option value="relevance">Relevancia</option>
                         <option value="title">Título</option>
                         <option value="date">Más antiguas primero</option>
                    </select>
               </label>
               <label>Tipo
                    <select id="type">
                         <option value="all">Todos</option>
                    </select>
               </label>
          </div>
          <p id="info"></p>
          <div id="gallery"></div>
          <button id="more" type="button" hidden>Cargar más</button>
          
          <dialog id="modal"></dialog>
          <dialog id="collage">
               <div class="collage-header">
                    <h2>Mi collage</h2>
                    <button id="close-collage" type="button">Cerrar</button>
               </div>
               <div id="board"></div>
          </dialog>

          <script src="/src/main.ts" type="module"></script>
     </body>
</html>
