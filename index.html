<!DOCTYPE html>
<html lang="es">
     <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>M2 - Async Odyssey</title>
          <dialog id="modal"></dialog>
          <script src="/src/main.ts" type="module"></script>
     </head>
     <body>
          <h1>Pinacoteca de bolsillo</h1>
          <form id="form">
               <input id="input" type="search" placeholder="Busca un artista o tema...">
               <button type="submit">Buscar</button>
          </form>
          <div id="controls">
               <label>Ordenar
                    <select id="sort">
                         <option value="relevance">Relevancia</option>
                         <option value="title">Título</option>
                         <option value="date">Más antiguas primero</option>
                    </select>
               </label>
               <label>Tipo
                    <select id="type">
                         <option value="all">Todos</option>
                    </select>
               </label>
          </div>
          <p id="info"></p>
          <div id="gallery"></div>
          
     </body>
</html>
